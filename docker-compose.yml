services:

  # INFRASTRUCTURE 

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: smartship-sqlserver
    ports:
      - "1434:1433"
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=${DOCKER_SA_PASSWORD}
      - MSSQL_PID=Express
      - TZ=Asia/Kolkata
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P '${DOCKER_SA_PASSWORD}' -Q 'SELECT 1' -No -C"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  rabbitmq:
    image: rabbitmq:3-management
    container_name: smartship-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USERNAME}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD}
      - TZ=Asia/Kolkata
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s

  # MICROSERVICES

  identity-service:
    build:
      context: .
      dockerfile: Services/SmartShip.IdentityService/Dockerfile
    container_name: smartship-identity
    ports:
      - "5001:8080"
    volumes:
      - identity-logs:/app/logs/identity
    environment:
      - ASPNETCORE_ENVIRONMENT=DockerJenkins
      - ASPNETCORE_URLS=http://+:8080
      - TZ=Asia/Kolkata
      # Database
      - ConnectionStrings__DefaultConnection=${DOCKER_CS_IDENTITY}
      # JWT
      - JwtSettings__Key=${JWT_KEY}
      - JwtSettings__Issuer=${JWT_ISSUER}
      - JwtSettings__Audience=${JWT_AUDIENCE}
      - JwtSettings__ExpiryMinutes=${JWT_EXPIRY_MINUTES}
      # RabbitMQ
      - RabbitMQ__Host=${RABBITMQ_DOCKER_HOST}
      - RabbitMQ__Username=${RABBITMQ_USERNAME}
      - RabbitMQ__Password=${RABBITMQ_PASSWORD}
      # Internal API
      - InternalApi__ApiKey=${INTERNAL_API_KEY}
      # Email
      - EmailSettings__Host=${EMAIL_HOST}
      - EmailSettings__Port=${EMAIL_PORT}
      - EmailSettings__SenderEmail=${EMAIL_SENDER_EMAIL}
      - EmailSettings__SenderName=${EMAIL_SENDER_NAME}
      - EmailSettings__Password=${EMAIL_PASSWORD}
      # Serilog
      - Serilog__WriteTo__1__Args__path=${DOCKER_LOG_IDENTITY}
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: on-failure

  shipment-service:
    build:
      context: .
      dockerfile: Services/SmartShip.ShipmentService/Dockerfile
    container_name: smartship-shipment
    ports:
      - "5002:8080"
    volumes:
      - shipment-logs:/app/logs/shipment
    environment:
      - ASPNETCORE_ENVIRONMENT=DockerJenkins
      - ASPNETCORE_URLS=http://+:8080
      - TZ=Asia/Kolkata
      # Database
      - ConnectionStrings__DefaultConnection=${DOCKER_CS_SHIPMENT}
      # JWT
      - JwtSettings__Key=${JWT_KEY}
      - JwtSettings__Issuer=${JWT_ISSUER}
      - JwtSettings__Audience=${JWT_AUDIENCE}
      # RabbitMQ
      - RabbitMQ__Host=${RABBITMQ_DOCKER_HOST}
      - RabbitMQ__Username=${RABBITMQ_USERNAME}
      - RabbitMQ__Password=${RABBITMQ_PASSWORD}
      # Internal API
      - InternalApi__ApiKey=${INTERNAL_API_KEY}
      # Service URLs
      - Services__IdentityService=${DOCKER_IDENTITY_URL}
      - Services__PaymentService=${DOCKER_PAYMENT_URL}
      # Serilog
      - Serilog__WriteTo__1__Args__path=${DOCKER_LOG_SHIPMENT}
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: on-failure

  tracking-service:
    build:
      context: .
      dockerfile: Services/SmartShip.TrackingService/Dockerfile
    container_name: smartship-tracking
    ports:
      - "5003:8080"
    volumes:
      - tracking-logs:/app/logs/tracking
    environment:
      - ASPNETCORE_ENVIRONMENT=DockerJenkins
      - ASPNETCORE_URLS=http://+:8080
      - TZ=Asia/Kolkata
      # Database
      - ConnectionStrings__DefaultConnection=${DOCKER_CS_TRACKING}
      # JWT
      - JwtSettings__Key=${JWT_KEY}
      - JwtSettings__Issuer=${JWT_ISSUER}
      - JwtSettings__Audience=${JWT_AUDIENCE}
      # RabbitMQ
      - RabbitMQ__Host=${RABBITMQ_DOCKER_HOST}
      - RabbitMQ__Username=${RABBITMQ_USERNAME}
      - RabbitMQ__Password=${RABBITMQ_PASSWORD}
      # Serilog
      - Serilog__WriteTo__1__Args__path=${DOCKER_LOG_TRACKING}
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: on-failure

  admin-service:
    build:
      context: .
      dockerfile: Services/SmartShip.AdminService/Dockerfile
    container_name: smartship-admin
    ports:
      - "5004:8080"
    volumes:
      - admin-logs:/app/logs/admin
    environment:
      - ASPNETCORE_ENVIRONMENT=DockerJenkins
      - ASPNETCORE_URLS=http://+:8080
      - TZ=Asia/Kolkata
      # Database
      - ConnectionStrings__DefaultConnection=${DOCKER_CS_ADMIN}
      # JWT
      - JwtSettings__Key=${JWT_KEY}
      - JwtSettings__Issuer=${JWT_ISSUER}
      - JwtSettings__Audience=${JWT_AUDIENCE}
      # RabbitMQ
      - RabbitMQ__Host=${RABBITMQ_DOCKER_HOST}
      - RabbitMQ__Username=${RABBITMQ_USERNAME}
      - RabbitMQ__Password=${RABBITMQ_PASSWORD}
      # Serilog
      - Serilog__WriteTo__1__Args__path=${DOCKER_LOG_ADMIN}
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: on-failure

  payment-service:
    build:
      context: .
      dockerfile: Services/SmartShip.PaymentService/Dockerfile
    container_name: smartship-payment
    ports:
      - "5005:8080"
    volumes:
      - payment-logs:/app/logs/payment
    environment:
      - ASPNETCORE_ENVIRONMENT=DockerJenkins
      - ASPNETCORE_URLS=http://+:8080
      - TZ=Asia/Kolkata
      # Database
      - ConnectionStrings__DefaultConnection=${DOCKER_CS_PAYMENT}
      # JWT
      - JwtSettings__Key=${JWT_KEY}
      - JwtSettings__Issuer=${JWT_ISSUER}
      - JwtSettings__Audience=${JWT_AUDIENCE}
      # RabbitMQ
      - RabbitMQ__Host=${RABBITMQ_DOCKER_HOST}
      - RabbitMQ__Username=${RABBITMQ_USERNAME}
      - RabbitMQ__Password=${RABBITMQ_PASSWORD}
      # Internal API
      - InternalApi__ApiKey=${INTERNAL_API_KEY}
      # Razorpay
      - Razorpay__KeyId=${RAZORPAY_KEY_ID}
      - Razorpay__KeySecret=${RAZORPAY_KEY_SECRET}
      # Service URLs
      - Services__ShipmentService=${DOCKER_SHIPMENT_URL}
      # Serilog
      - Serilog__WriteTo__1__Args__path=${DOCKER_LOG_PAYMENT}
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: on-failure

  notification-service:
    build:
      context: .
      dockerfile: Services/SmartShip.NotificationService/Dockerfile
    container_name: smartship-notification
    ports:
      - "5006:8080"
    volumes:
      - notification-logs:/app/logs/notification
    environment:
      - ASPNETCORE_ENVIRONMENT=DockerJenkins
      - ASPNETCORE_URLS=http://+:8080
      - TZ=Asia/Kolkata
      # Database
      - ConnectionStrings__DefaultConnection=${DOCKER_CS_NOTIFICATION}
      # JWT
      - JwtSettings__Key=${JWT_KEY}
      - JwtSettings__Issuer=${JWT_ISSUER}
      - JwtSettings__Audience=${JWT_AUDIENCE}
      # RabbitMQ
      - RabbitMQ__Host=${RABBITMQ_DOCKER_HOST}
      - RabbitMQ__Username=${RABBITMQ_USERNAME}
      - RabbitMQ__Password=${RABBITMQ_PASSWORD}
      # Internal API
      - InternalApi__ApiKey=${INTERNAL_API_KEY}
      # Email
      - EmailSettings__Host=${EMAIL_HOST}
      - EmailSettings__Port=${EMAIL_PORT}
      - EmailSettings__SenderEmail=${EMAIL_SENDER_EMAIL}
      - EmailSettings__SenderName=${EMAIL_SENDER_NAME}
      - EmailSettings__Password=${EMAIL_PASSWORD}
      # Service URLs
      - ServiceUrls__IdentityService=${DOCKER_IDENTITY_URL}
      - ServiceUrls__ShipmentService=${DOCKER_SHIPMENT_URL}
      # Serilog
      - Serilog__WriteTo__1__Args__path=${DOCKER_LOG_NOTIFICATION}
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: on-failure

  api-gateway:
    build:
      context: .
      dockerfile: Gateway/SmartShip.Gateway/Dockerfile
    container_name: smartship-gateway
    ports:
      - "5000:8080"
    volumes:
      - gateway-logs:/app/logs/gateway
    environment:
      - ASPNETCORE_ENVIRONMENT=DockerJenkins
      - ASPNETCORE_URLS=http://+:8080
      - TZ=Asia/Kolkata
      # JWT
      - JwtSettings__Key=${JWT_KEY}
      - JwtSettings__Issuer=${JWT_ISSUER}
      - JwtSettings__Audience=${JWT_AUDIENCE}
      # Health check URLs
      - ServiceHealthChecks__Identity=${DOCKER_HEALTH_IDENTITY}
      - ServiceHealthChecks__Shipment=${DOCKER_HEALTH_SHIPMENT}
      - ServiceHealthChecks__Tracking=${DOCKER_HEALTH_TRACKING}
      - ServiceHealthChecks__Admin=${DOCKER_HEALTH_ADMIN}
      - ServiceHealthChecks__Payment=${DOCKER_HEALTH_PAYMENT}
      - ServiceHealthChecks__Notification=${DOCKER_HEALTH_NOTIFICATION}
      # Serilog
      - Serilog__WriteTo__1__Args__path=${DOCKER_LOG_GATEWAY}
    depends_on:
      - identity-service
      - shipment-service
      - tracking-service
      - admin-service
      - payment-service
      - notification-service
    restart: on-failure

# VOLUMES

volumes:
  gateway-logs:
  admin-logs:
  identity-logs:
  shipment-logs:
  payment-logs:
  notification-logs:
  tracking-logs:
  sqlserver-data:
  rabbitmq-data: