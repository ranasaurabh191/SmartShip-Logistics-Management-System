
services:

  # ═══════════════════ INFRASTRUCTURE ═══════════════════

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: smartship-sqlserver
    ports:
      - "1434:1433"
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=SmartShip@123!
      - MSSQL_PID=Express
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'SmartShip@123!' -Q 'SELECT 1' -No -C"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  rabbitmq:
    image: rabbitmq:3-management
    container_name: smartship-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s

  # ═══════════════════ MICROSERVICES ═══════════════════

  identity-service:
    build:
      context: .
      dockerfile: Services/SmartShip.IdentityService/Dockerfile
    container_name: smartship-identity
    ports:
      - "5001:8080"
    volumes:
      - smartship-logs:/app/logs/identity
    environment:
      - ASPNETCORE_ENVIRONMENT=DockerJenkins
      - ASPNETCORE_URLS=http://+:8080
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: on-failure

  shipment-service:
    build:
      context: .
      dockerfile: Services/SmartShip.ShipmentService/Dockerfile
    container_name: smartship-shipment
    ports:
      - "5002:8080"
    volumes:
      - smartship-logs:/app/logs/shipment
    environment:
      - ASPNETCORE_ENVIRONMENT=DockerJenkins
      - ASPNETCORE_URLS=http://+:8080
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: on-failure

  tracking-service:
    build:
      context: .
      dockerfile: Services/SmartShip.TrackingService/Dockerfile
    container_name: smartship-tracking
    ports:
      - "5003:8080"
    volumes:
      - smartship-logs:/app/logs/tracking 
    environment:
      - ASPNETCORE_ENVIRONMENT=DockerJenkins
      - ASPNETCORE_URLS=http://+:8080
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: on-failure

  admin-service:
    build:
      context: .
      dockerfile: Services/SmartShip.AdminService/Dockerfile
    container_name: smartship-admin
    ports:
      - "5004:8080"
    volumes:
      - smartship-logs:/app/logs/admin
    environment:
      - ASPNETCORE_ENVIRONMENT=DockerJenkins
      - ASPNETCORE_URLS=http://+:8080
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: on-failure

  payment-service:
    build:
      context: .
      dockerfile: Services/SmartShip.PaymentService/Dockerfile
    container_name: smartship-payment
    ports:
      - "5005:8080"
    volumes:
      - smartship-logs:/app/logs/payment 
    environment:
      - ASPNETCORE_ENVIRONMENT=DockerJenkins
      - ASPNETCORE_URLS=http://+:8080
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: on-failure

  notification-service:
    build:
      context: .
      dockerfile: Services/SmartShip.NotificationService/Dockerfile
    container_name: smartship-notification
    ports:
      - "5006:8080"
    volumes:
      - smartship-logs:/app/logs/notification
    environment:
      - ASPNETCORE_ENVIRONMENT=DockerJenkins
      - ASPNETCORE_URLS=http://+:8080
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: on-failure

  api-gateway:
    build:
      context: .
      dockerfile: Gateway/SmartShip.Gateway/Dockerfile
    container_name: smartship-gateway
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=DockerJenkins
      - ASPNETCORE_URLS=http://+:8080
    volumes:
      - smartship-logs:/app/logs/gateway
    depends_on:
      - identity-service
      - shipment-service
      - tracking-service
      - admin-service
      - payment-service
      - notification-service
    restart: on-failure


volumes:
  smartship-logs: 
  sqlserver-data:
  rabbitmq-data:
